[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-employment-terms-agent"
version = "0.2.0"
description = "Local web research assistant for overseas employment contract terms and probation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Alex Dou"}]
dependencies = []

[project.scripts]
global-employment-terms-agent = "employment_agent.server:main"

[tool.setuptools.packages.find]
include = ["employment_agent*"]

[tool.setuptools.package-data]
employment_agent = ["static/*.html", "static/*.css", "static/*.js"]
